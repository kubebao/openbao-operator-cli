name: Feature request
description: Propose a CLI capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
      description: Describe the workflow and the information or action it needs.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example command or output when useful.
    validations:
      required: true
