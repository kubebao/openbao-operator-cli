name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make secret-scan

  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint, race tests, and build
        run: make check
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  vulnerabilities:
    name: Go vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vulncheck

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check-licenses

  distribution:
    name: Distribution archives
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Select archive version
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          version="0.0.0-dev.${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version="$(python3 scripts/edge_release.py version)"
          fi
          echo "DIST_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build distribution archives
        run: make release-check dist DIST_VERSION="$DIST_VERSION"
      - name: Upload distribution archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubebao-distribution-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Download distribution archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kubebao-distribution-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded-distribution
      - name: Verify downloaded archives
        run: |
          diff --recursive dist "$RUNNER_TEMP/downloaded-distribution"
          make verify-dist DIST_DIR="$RUNNER_TEMP/downloaded-distribution"
      - name: Stage the main candidate without publishing
        if: >-
          github.repository == 'kubebao/openbao-operator-cli' && !github.event.repository.private &&
          github.ref == 'refs/heads/main'
        run: python3 scripts/stage_release.py "$RUNNER_TEMP/downloaded-distribution"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          github.repository == 'kubebao/openbao-operator-cli' && !github.event.repository.private &&
          github.ref == 'refs/heads/main'
        with:
          name: cli-edge-payload-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded-distribution/release/
          if-no-files-found: error
          retention-days: 7

  edge-provenance:
    name: Edge candidate provenance
    needs: [secrets, go, vulnerabilities, licenses, distribution]
    if: >-
      github.repository == 'kubebao/openbao-operator-cli' && !github.event.repository.private &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      BUILD_RUN_ID: ${{ github.run_id }}
      BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-edge-payload-${{ github.run_attempt }}
          path: payload
      - name: Verify the qualified payload
        run: python3 scripts/edge_release.py verify payload
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: payload/checksums.txt
      - name: Preserve offline CI provenance
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" payload/provenance.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-edge-candidate-${{ github.run_attempt }}
          path: payload/
          if-no-files-found: error
          retention-days: 7
