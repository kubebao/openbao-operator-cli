name: Nix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nix.yml
      - flake.nix
      - flake.lock
      - nix/**
      - go.mod
      - go.sum
      - packaging/kubectl/**
  push:
    branches: [main]
    paths:
      - .github/workflows/nix.yml
      - flake.nix
      - flake.lock
      - nix/**
      - go.mod
      - go.sum
      - packaging/kubectl/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Nix (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Evaluate all supported systems
        run: nix flake check --all-systems --no-build
      - name: Check Nix formatting
        run: nix fmt -- --check flake.nix nix/*.nix
      - name: Build and test the native package and command entry points
        run: nix flake check --print-build-logs
